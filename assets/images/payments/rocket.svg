<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 218 68" fill="none" role="img" aria-label="Rocket">
  <!-- DBBL Rocket soaring folded paper-dart emblem -->
  <g transform="translate(4, 5)">
    <!-- Upper-left main dart wing -->
    <polygon points="4,28.5 64,2 30.2,36.8" fill="#8C3494"/>
    <!-- Center underside tail fold notch -->
    <polygon points="31.4,38.4 49.2,17.8 36.2,48.6 32.8,55.2" fill="#6F2377"/>
    <!-- Lower-right broad soaring wing -->
    <polygon points="37.8,41.6 64,2 50.6,55.8" fill="#8C3494"/>
    <!-- Crisp inner highlight crease -->
    <line x1="31" y1="37.4" x2="62.2" y2="3.8" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round"/>
  </g>
  <!-- Bold DBBL ROCKET wordmark -->
  <text x="76" y="42" font-family="Manrope, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" letter-spacing="0.4" fill="#8C3494">ROCKET</text>
  <text x="77" y="56" font-family="Inter, sans-serif" font-size="9.2" font-weight="700" letter-spacing="1.1" fill="#6F2377">DBBL MOBILE BANKING</text>
</svg>
