        <linearGradient id="softPanel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E64B65" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0.03"/>
        </linearGradient>
        <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E64B65" stop-opacity="0.24"/>
            <stop offset="100%" stop-color="#E64B65" stop-opacity="0.0"/>
        </linearGradient>
        <radialGradient id="glowOrb" cx="82%" cy="14%" r="48%">
