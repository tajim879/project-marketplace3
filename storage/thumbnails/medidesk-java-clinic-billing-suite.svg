<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#F7F8FD"/>
            <stop offset="55%" stop-color="#F1F3FA"/>
            <stop offset="100%" stop-color="#ECEFFA"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E64B65"/>
            <stop offset="100%" stop-color="#635BFF"/>
        </linearGradient>
        <linearGradient id="softPanel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E64B65" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#635BFF" stop-opacity="0.03"/>
        </linearGradient>
        <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E64B65" stop-opacity="0.24"/>
            <stop offset="100%" stop-color="#E64B65" stop-opacity="0.0"/>
        </linearGradient>
        <radialGradient id="glowOrb" cx="82%" cy="14%" r="48%">
            <stop offset="0%" stop-color="#E64B65" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#E64B65" stop-opacity="0"/>
        </radialGradient>
        <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="122%">
            <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#202438" flood-opacity="0.085"/>
        </filter>
    </defs>
    <rect width="800" height="500" fill="url(#bgGrad)"/>
    <rect width="800" height="500" fill="url(#glowOrb)"/>
